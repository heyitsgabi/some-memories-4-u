<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Archive</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: #050505;
}

body {
    min-height: 100vh;

    background: #050505;

    color: #f4f4f4;

    font-family: Georgia, serif;

    overflow-x: hidden;

    opacity: 0;

    transition: opacity 0.18s ease;
}

body.page-ready {
    opacity: 1;
}


/* =====================================================
   PAGE
===================================================== */

.page {
    min-height: 100vh;

    position: relative;

    overflow: hidden;

    padding: 75px 22px 55px;

    display: flex;

    justify-content: center;

    align-items: center;
}


/* =====================================================
   LIGHTING
===================================================== */

.top-light,
.bottom-light {
    position: absolute;

    border-radius: 50%;

    pointer-events: none;
}

.top-light {
    width: 850px;

    height: 430px;

    top: -330px;

    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.13);

    filter: blur(110px);
}

.bottom-light {
    width: 850px;

    height: 420px;

    bottom: -330px;

    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.10);

    filter: blur(110px);
}


/* =====================================================
   CONTENT
===================================================== */

.content {
    width: 100%;

    max-width: 600px;

    position: relative;

    z-index: 5;

    text-align: center;
}


/* =====================================================
   HEADER
===================================================== */

.eyebrow {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 5px;

    color: #777;

    text-transform: uppercase;

    margin-bottom: 15px;
}

h1 {
    font-size: clamp(42px, 8vw, 66px);

    font-weight: normal;

    letter-spacing: -2px;

    margin-bottom: 18px;

    text-shadow:
        0 0 20px rgba(255,255,255,0.20),
        0 0 55px rgba(255,255,255,0.08);
}


/* =====================================================
   DIVIDER
===================================================== */

.header-line {
    width: 55px;

    height: 1px;

    background: rgba(255,255,255,0.35);

    margin: 0 auto 28px;
}


/* =====================================================
   MESSAGE
===================================================== */

.subtitle {
    max-width: 440px;

    margin: 0 auto;

    color: #999;

    font-size: 15px;

    line-height: 1.8;
}


/* =====================================================
   SMALL ARCHIVE NOTE
===================================================== */

.archive-note {
    margin-top: 14px;

    color: #666;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =====================================================
   CONTINUE
===================================================== */

.navigation {
    margin-top: 45px;

    padding-top: 25px;

    border-top:
        1px solid
        rgba(255,255,255,0.08);
}

.nav-button {
    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 11px;

    min-width: 175px;

    padding: 13px 22px;

    border:
        1px solid
        rgba(255,255,255,0.20);

    color: #d8d8d8;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 3px;

    text-transform: uppercase;

    background:
        rgba(255,255,255,0.025);

    transition:
        background 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
}

.nav-arrow {
    font-size: 14px;

    letter-spacing: 0;

    transition:
        transform 0.18s ease;
}

.nav-button:hover {
    background:
        rgba(255,255,255,0.08);

    border-color:
        rgba(255,255,255,0.38);

    color: #fff;

    transform:
        translateY(-2px);
}

.nav-button:hover .nav-arrow {
    transform:
        translateX(3px);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .page {
        padding:
            65px 18px 40px;
    }

    h1 {
        font-size: 46px;
    }

    .subtitle {
        font-size: 14px;
    }

    .navigation {
        margin-top: 38px;

        padding-top: 22px;
    }

    .nav-button {
        min-width: 165px;

        padding:
            12px 18px;
    }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    body,
    .nav-button,
    .nav-arrow {
        transition: none;
    }

}

</style>

</head>


<body>

<main class="page">

    <div class="top-light"></div>

    <div class="bottom-light"></div>


    <div class="content">


        <!-- =================================================
             HEADER
        ================================================= -->

        <div class="eyebrow">
            $OME MEMORIES 4 U
        </div>


        <h1>
            THE ARCHIVE
        </h1>


        <div class="header-line"></div>


        <!-- =================================================
             MESSAGE
        ================================================= -->

        <p class="subtitle">
            Welcome to the archive.
            A few things worth keeping,
            because apparently some memories
            deserved their own little corner.
        </p>


        <div class="archive-note">
            01 · The collection begins here
        </div>


        <!-- =================================================
             NAVIGATION
        ================================================= -->

        <div class="navigation">

            <a
                href="soundtrack.html"
                class="nav-button"
            >

                Continue

                <span class="nav-arrow">
                    →
                </span>

            </a>

        </div>


    </div>

</main>


<script>

/* =====================================================
   SIMPLE PAGE ENTRY
===================================================== */

window.addEventListener("DOMContentLoaded", function () {

    requestAnimationFrame(function () {

        document.body.classList.add("page-ready");

    });

});

</script>


</body>
</html>
