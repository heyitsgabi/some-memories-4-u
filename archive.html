<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Archive</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: #050505;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #f4f4f4;
    font-family: Georgia, serif;
    overflow-x: hidden;

    opacity: 1;
    transition: opacity 0.08s ease;
}

body.leaving {
    opacity: 0;
}

.page {
    min-height: 100vh;
    position: relative;
    overflow: hidden;

    padding: 75px 22px 55px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.top-light,
.bottom-light {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.top-light {
    width: 850px;
    height: 430px;
    top: -330px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.13);
    filter: blur(110px);
}

.bottom-light {
    width: 850px;
    height: 420px;
    bottom: -330px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.10);
    filter: blur(110px);
}

.content {
    width: 100%;
    max-width: 600px;

    position: relative;
    z-index: 5;

    text-align: center;
}

.eyebrow {
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 5px;
    color: #777;
    text-transform: uppercase;
    margin-bottom: 15px;
}

h1 {
    font-size: clamp(42px, 8vw, 66px);
    font-weight: normal;
    letter-spacing: -2px;
    margin-bottom: 18px;

    text-shadow:
        0 0 20px rgba(255,255,255,0.20),
        0 0 55px rgba(255,255,255,0.08);
}

.subtitle {
    max-width: 430px;
    margin: 0 auto 42px;
    color: #999;
    font-size: 14px;
    line-height: 1.7;
}

.archive-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
    width: 100%;
}

.archive-item {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: space-between;

    width: 100%;
    min-height: 72px;

    padding: 0 24px;

    border: 1px solid rgba(255,255,255,0.13);

    background: rgba(255,255,255,0.025);

    text-decoration: none;
    color: #f2f2f2;

    transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
}

.archive-item:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.28);
    transform: translateY(-2px);
}

.item-left {
    display: flex;
    align-items: center;
    gap: 17px;
    text-align: left;
}

.number {
    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    color: #666;
}

.item-title {
    font-size: 17px;
    letter-spacing: 0.2px;
}

.item-description {
    margin-top: 4px;

    font-family: Arial, sans-serif;
    font-size: 9px;
    letter-spacing: 1.5px;

    color: #666;

    text-transform: uppercase;
}

.arrow {
    font-family: Arial, sans-serif;
    font-size: 15px;
    color: #777;

    transition:
        transform 0.18s ease,
        color 0.18s ease;
}

.archive-item:hover .arrow {
    transform: translateX(4px);
    color: #fff;
}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.navigation {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    margin-top: 42px;
    padding-top: 25px;

    border-top: 1px solid rgba(255,255,255,0.08);
}

.nav-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;

    min-width: 150px;

    padding: 13px 19px;

    border: 1px solid rgba(255,255,255,0.20);

    color: #d8d8d8;

    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 8px;
    letter-spacing: 3px;

    text-transform: uppercase;

    background: rgba(255,255,255,0.025);

    transition:
        background 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
}

.nav-arrow {
    font-size: 14px;
    letter-spacing: 0;

    transition: transform 0.18s ease;
}

.nav-button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.38);
    color: #fff;
    transform: translateY(-2px);
}

.nav-button:hover .nav-arrow {
    transform: translateX(3px);
}

.nav-button.back:hover .nav-arrow {
    transform: translateX(-3px);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .page {
        padding: 65px 18px 40px;
    }

    h1 {
        font-size: 46px;
    }

    .subtitle {
        margin-bottom: 32px;
    }

    .archive-item {
        min-height: 68px;
        padding: 0 18px;
    }

    .item-left {
        gap: 13px;
    }

    .item-title {
        font-size: 16px;
    }

    .item-description {
        font-size: 8px;
    }

    .navigation {
        margin-top: 36px;
        padding-top: 23px;
        gap: 9px;
    }

    .nav-button {
        min-width: 0;
        flex: 1;
        padding: 12px 10px;
        letter-spacing: 2.2px;
    }

}


/* =====================================================
   ACCESSIBILITY
===================================================== */

@media (prefers-reduced-motion: reduce) {

    body {
        transition: none;
    }

    .archive-item,
    .nav-button,
    .nav-arrow,
    .arrow {
        transition: none;
    }

}

</style>
</head>


<body>

<main class="page">

    <div class="top-light"></div>

    <div class="bottom-light"></div>


    <div class="content">


        <!-- =============================================
             HEADER
        ============================================= -->

        <div class="eyebrow">
            $OME MEMORIES 4 U
        </div>


        <h1>
            THE ARCHIVE
        </h1>


        <p class="subtitle">
            A few things worth keeping.
        </p>


        <!-- =============================================
             ARCHIVE SECTIONS
        ============================================= -->

        <div class="archive-list">


            <!-- MUSIC -->

            <a
                href="/some-memories-4-u/soundtrack.html"
                class="archive-item page-link"
            >

                <div class="item-left">

                    <div class="number">
                        01
                    </div>

                    <div>

                        <div class="item-title">
                            Music
                        </div>

                        <div class="item-description">
                            Songs · suggestions · things you made me listen to
                        </div>

                    </div>

                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <!-- MOMENTS -->

            <a
                href="/some-memories-4-u/moments.html"
                class="archive-item page-link"
            >

                <div class="item-left">

                    <div class="number">
                        02
                    </div>

                    <div>

                        <div class="item-title">
                            Moments
                        </div>

                        <div class="item-description">
                            You · us · places · little moments in between
                        </div>

                    </div>

                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <!-- MEMORIES -->

            <a
                href="/some-memories-4-u/memories.html"
                class="archive-item page-link"
            >

                <div class="item-left">

                    <div class="number">
                        03
                    </div>

                    <div>

                        <div class="item-title">
                            Memories
                        </div>

                        <div class="item-description">
                            Videos · screenshots · proof of weirdness
                        </div>

                    </div>

                </div>

                <div class="arrow">
                    →
                </div>

            </a>


        </div>


        <!-- =============================================
             NAVIGATION
        ============================================= -->

        <div class="navigation">


            <!-- BACK TO MESSAGE -->

            <a
                href="/some-memories-4-u/message.html"
                class="nav-button back page-link"
            >

                <span class="nav-arrow">
                    ←
                </span>

                Back to message

            </a>


            <!-- CONTINUE TO BIRTHDAY -->

            <a
                href="/some-memories-4-u/birthday.html"
                class="nav-button page-link"
            >

                Continue

                <span class="nav-arrow">
                    →
                </span>

            </a>


        </div>


    </div>

</main>


<script>

/* =====================================================
   FAST PAGE PRELOADING
===================================================== */

const pageLinks = document.querySelectorAll('.page-link');

pageLinks.forEach(function(link) {

    const href = link.getAttribute('href');

    if (!href) return;

    /*
     * Start loading the destination as soon as the user
     * moves toward the link.
     */

    link.addEventListener('pointerenter', function() {

        if (!document.querySelector(
            'link[rel="prefetch"][href="' + href + '"]'
        )) {

            const prefetch = document.createElement('link');

            prefetch.rel = 'prefetch';
            prefetch.href = href;

            document.head.appendChild(prefetch);
        }

    }, { once: true });


    /*
     * On phones there is no pointerenter, so preload when
     * the user touches the link.
     */

    link.addEventListener('touchstart', function() {

        if (!document.querySelector(
            'link[rel="prefetch"][href="' + href + '"]'
        )) {

            const prefetch = document.createElement('link');

            prefetch.rel = 'prefetch';
            prefetch.href = href;

            document.head.appendChild(prefetch);
        }

    }, { once: true });

});


/* =====================================================
   FAST PAGE NAVIGATION
===================================================== */

pageLinks.forEach(function(link) {

    link.addEventListener('click', function(event) {

        const href = link.getAttribute('href');

        if (
            !href ||
            href.startsWith('#') ||
            link.target === '_blank' ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey
        ) {
            return;
        }

        event.preventDefault();

        /*
         * Extremely short fade.
         * The old version waited 80ms.
         * This is intentionally almost instant.
         */

        document.body.classList.add('leaving');

        window.location.href = href;

    });

});


/* =====================================================
   BACK/FORWARD CACHE FIX
===================================================== */

window.addEventListener('pageshow', function(event) {

    document.body.classList.remove('leaving');

});


/* =====================================================
   RESTORE PAGE IF BROWSER RETURNS TO IT
===================================================== */

window.addEventListener('pagehide', function() {

    document.body.classList.remove('leaving');

});

</script>

</body>
</html>
