<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proceed</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #f4f4f4;

    font-family: Georgia, serif;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 30px;
}

.page {
    width: 100%;
    max-width: 500px;
}

.message {
    font-size: clamp(28px, 7vw, 42px);

    font-weight: normal;

    letter-spacing: -1px;

    line-height: 1.35;

    text-shadow:
        0 0 20px rgba(255,255,255,0.18),
        0 0 50px rgba(255,255,255,0.08);

    animation: appear 0.8s ease forwards;
}

.sub {
    margin-top: 14px;

    color: #888;

    font-size: 14px;

    line-height: 1.6;

    animation: appear 1s ease forwards;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

</style>
</head>
