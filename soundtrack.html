<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soundtrack</title>

    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at center, #303030 0%, #181818 35%, #070707 78%);
        color: #f5f5f5;
        font-family: Georgia, serif;
        overflow-x: hidden;
    }

    .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 70px 25px;
        position: relative;
        overflow: hidden;
    }

    /* Main cinematic glow */
    .glow {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.09);
        filter: blur(110px);
        z-index: 0;
    }

    /* Large abstract waveform */
    .waveform {
        position: absolute;
        width: 130%;
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        opacity: 0.32;
        z-index: 0;
        transform: rotate(-4deg);
    }

    .waveform span {
        display: block;
        width: 3px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.55);
    }

    .waveform span:nth-child(1) { height: 35px; }
    .waveform span:nth-child(2) { height: 70px; }
    .waveform span:nth-child(3) { height: 110px; }
    .waveform span:nth-child(4) { height: 55px; }
    .waveform span:nth-child(5) { height: 150px; }
    .waveform span:nth-child(6) { height: 210px; }
    .waveform span:nth-child(7) { height: 125px; }
    .waveform span:nth-child(8) { height: 190px; }
    .waveform span:nth-child(9) { height: 240px; }
    .waveform span:nth-child(10) { height: 160px; }
    .waveform span:nth-child(11) { height: 95px; }
    .waveform span:nth-child(12) { height: 180px; }
    .waveform span:nth-child(13) { height: 250px; }
    .waveform span:nth-child(14) { height: 190px; }
    .waveform span:nth-child(15) { height: 130px; }
    .waveform span:nth-child(16) { height: 220px; }
    .waveform span:nth-child(17) { height: 150px; }
    .waveform span:nth-child(18) { height: 90px; }
    .waveform span:nth-child(19) { height: 170px; }
    .waveform span:nth-child(20) { height: 235px; }
    .waveform span:nth-child(21) { height: 145px; }
    .waveform span:nth-child(22) { height: 75px; }
    .waveform span:nth-child(23) { height: 125px; }
    .waveform span:nth-child(24) { height: 190px; }
    .waveform span:nth-child(25) { height: 110px; }
    .waveform span:nth-child(26) { height: 160px; }
    .waveform span:nth-child(27) { height: 220px; }
    .waveform span:nth-child(28) { height: 130px; }
    .waveform span:nth-child(29) { height: 75px; }
    .waveform span:nth-child(30) { height: 45px; }

    /* Large record behind the playlist */
    .record {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
            0 0 0 25px rgba(255, 255, 255, 0.025),
            0 0 0 70px rgba(255, 255, 255, 0.015);
        z-index: 0;
    }

    .record::before {
        content: "";
        position: absolute;
        inset: 65px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .record::after {
        content: "";
        position: absolute;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    /* Small intentional music notes */
    .note {
        position: absolute;
        color: rgba(255, 255, 255, 0.32);
        font-size: 22px;
        z-index: 1;
    }

    .note.one {
        top: 17%;
        left: 12%;
        transform: rotate(-12deg);
    }

    .note.two {
        top: 25%;
        right: 12%;
        font-size: 17px;
        transform: rotate(10deg);
    }

    .note.three {
        bottom: 18%;
        right: 15%;
        font-size: 25px;
        transform: rotate(-8deg);
    }

    /* Track numbers around the composition */
    .track-number {
        position: absolute;
        font-family: Arial, sans-serif;
        color: rgba(255, 255, 255, 0.2);
        font-size: 10px;
        letter-spacing: 4px;
        z-index: 1;
    }

    .track-one {
        top: 20%;
        left: 28%;
    }

    .track-two {
        top: 19%;
        right: 28%;
    }

    .track-three {
        bottom: 20%;
        left: 27%;
    }

    .track-four {
        bottom: 19%;
        right: 27%;
    }

    .content {
        width: 100%;
        max-width: 620px;
        position: relative;
        z-index: 3;
    }

    .eyebrow {
        font-family: Arial, sans-serif;
        font-size: 10px;
        letter-spacing: 5px;
        color: #a0a0a0;
        margin-bottom: 18px;
        text-transform: uppercase;
    }

    h1 {
        font-size: clamp(42px, 8vw, 70px);
        font-weight: normal;
        letter-spacing: -2px;
        margin-bottom: 25px;
    }

    .intro {
        max-width: 500px;
        margin: 0 auto 40px;
        font-size: 16px;
        line-height: 1.7;
        color: #c2c2c2;
    }

    .spotify-box {
        width: 100%;
        min-height: 352px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(0, 0, 0, 0.68);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        backdrop-filter: blur(15px);
        box-shadow:
            0 30px 100px rgba(0, 0, 0, 0.7),
            0 0 50px rgba(255, 255, 255, 0.04);
    }

    .spotify-placeholder {
        font-family: Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 3px;
        color: #999999;
        text-transform: uppercase;
    }

    .tease {
        font-size: 15px;
        color: #b5b5b5;
        font-style: italic;
        line-height: 1.7;
        margin-bottom: 12px;
    }

    .listen {
        font-family: Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 3px;
        color: #ffffff;
        text-transform: uppercase;
    }

    .back {
        display: inline-block;
        margin-top: 42px;
        color: #777777;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    .back:hover {
        color: #ffffff;
    }
</style>
</head>

<body>

    <main class="page">

        <div class="glow"></div>

        <div class="wave one"></div>
        <div class="wave two"></div>

        <div class="note one">♪</div>
        <div class="note two">♫</div>
        <div class="note three">♪</div>

        <div class="track-number track-one">01</div>
        <div class="track-number track-two">∞</div>

        <div class="content">

            <div class="eyebrow">
                $OME MEMORIES 4 U
            </div>

            <h1>THE SOUNDTRACK</h1>

            <p class="intro">
                A playlist made up of songs you like (I think) and songs you made me listen to.
            </p>

            <div class="spotify-box">
                <div class="spotify-placeholder">
                    Spotify playlist goes here
                </div>
            </div>

            <p class="tease">
                Some of these you’ll recognize… some you might not… hehe.
            </p>

            <div class="listen">
                Listen in order 😐
            </div>

            <a href="archive.html" class="back">
                ← Back to archive
            </a>

        </div>

    </main>

</body>
</html>
