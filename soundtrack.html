<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soundtrack</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #303030 0%, #171717 38%, #080808 78%);
            color: #f5f5f5;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 25px;
            position: relative;
            overflow: hidden;
        }

        /* Main light */
        .glow {
            position: absolute;
            width: 650px;
            height: 650px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.10);
            filter: blur(110px);
            z-index: 0;
        }

        /* Large waveform */
        .waveform {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.22;
            z-index: 0;
            transform: rotate(-5deg);
        }

        .waveform span {
            width: 3px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.75);
        }

        .waveform span:nth-child(1) { height: 35px; }
        .waveform span:nth-child(2) { height: 70px; }
        .waveform span:nth-child(3) { height: 120px; }
        .waveform span:nth-child(4) { height: 55px; }
        .waveform span:nth-child(5) { height: 150px; }
        .waveform span:nth-child(6) { height: 205px; }
        .waveform span:nth-child(7) { height: 130px; }
        .waveform span:nth-child(8) { height: 175px; }
        .waveform span:nth-child(9) { height: 235px; }
        .waveform span:nth-child(10) { height: 160px; }
        .waveform span:nth-child(11) { height: 95px; }
        .waveform span:nth-child(12) { height: 185px; }
        .waveform span:nth-child(13) { height: 245px; }
        .waveform span:nth-child(14) { height: 190px; }
        .waveform span:nth-child(15) { height: 125px; }
        .waveform span:nth-child(16) { height: 215px; }
        .waveform span:nth-child(17) { height: 150px; }
        .waveform span:nth-child(18) { height: 85px; }
        .waveform span:nth-child(19) { height: 175px; }
        .waveform span:nth-child(20) { height: 230px; }
        .waveform span:nth-child(21) { height: 145px; }
        .waveform span:nth-child(22) { height: 75px; }
        .waveform span:nth-child(23) { height: 115px; }
        .waveform span:nth-child(24) { height: 185px; }
        .waveform span:nth-child(25) { height: 110px; }
        .waveform span:nth-child(26) { height: 160px; }
        .waveform span:nth-child(27) { height: 220px; }
        .waveform span:nth-child(28) { height: 135px; }
        .waveform span:nth-child(29) { height: 75px; }
        .waveform span:nth-child(30) { height: 40px; }

        /* Large record */
        .record {
            position: absolute;
            width: 560px;
            height: 560px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow:
                0 0 0 25px rgba(255, 255, 255, 0.025),
                0 0 0 60px rgba(255, 255, 255, 0.018),
                0 0 0 100px rgba(255, 255, 255, 0.012);
            z-index: 0;
        }

        .record::before {
            content: "";
            position: absolute;
            inset: 45px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                inset 0 0 0 20px rgba(255, 255, 255, 0.012),
                inset 0 0 0 45px rgba(255, 255, 255, 0.012),
                inset 0 0 0 70px rgba(255, 255, 255, 0.012);
        }

        .record::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.18);
        }

        /* Tonearm */
        .tonearm {
            position: absolute;
            width: 230px;
            height: 2px;
            background: rgba(255, 255, 255, 0.28);
            right: 7%;
            top: 22%;
            transform: rotate(25deg);
            transform-origin: right center;
            z-index: 1;
        }

        .tonearm::before {
            content: "";
            position: absolute;
            right: -7px;
            top: -7px;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.28);
            border-radius: 50%;
        }

        .tonearm::after {
            content: "";
            position: absolute;
            left: -12px;
            top: -5px;
            width: 18px;
            height: 10px;
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(-8deg);
        }

        /* Music notes */
        .note {
            position: absolute;
            font-family: Georgia, serif;
            color: rgba(255, 255, 255, 0.36);
            z-index: 1;
        }

        .note.one {
            top: 12%;
            left: 10%;
            font-size: 32px;
            transform: rotate(-12deg);
        }

        .note.two {
            top: 20%;
            left: 23%;
            font-size: 19px;
            transform: rotate(8deg);
        }

        .note.three {
            top: 15%;
            right: 13%;
            font-size: 27px;
            transform: rotate(10deg);
        }

        .note.four {
            top: 39%;
            right: 7%;
            font-size: 18px;
            transform: rotate(-8deg);
        }

        .note.five {
            bottom: 18%;
            left: 9%;
            font-size: 25px;
            transform: rotate(8deg);
        }

        .note.six {
            bottom: 12%;
            left: 23%;
            font-size: 18px;
            transform: rotate(-10deg);
        }

        .note.seven {
            bottom: 16%;
            right: 12%;
            font-size: 31px;
            transform: rotate(-8deg);
        }

        .note.eight {
            bottom: 30%;
            right: 23%;
            font-size: 17px;
            transform: rotate(12deg);
        }

        /* Track numbers */
        .track {
            position: absolute;
            font-family: Arial, sans-serif;
            color: rgba(255, 255, 255, 0.23);
            font-size: 10px;
            letter-spacing: 4px;
            z-index: 1;
        }

        .track.one {
            top: 18%;
            left: 31%;
        }

        .track.two {
            top: 17%;
            right: 31%;
        }

        .track.three {
            bottom: 18%;
            left: 30%;
        }

        .track.four {
            bottom: 17%;
            right: 30%;
        }

        .track.five {
            top: 47%;
            left: 6%;
        }

        .track.six {
            top: 47%;
            right: 6%;
        }

        /* Main content */
        .content {
            width: 100%;
            max-width: 620px;
            position: relative;
            z-index: 5;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 5px;
            color: #a5a5a5;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(42px, 8vw, 70px);
            font-weight: normal;
            letter-spacing: -2px;
            margin-bottom: 25px;
        }

        .intro {
            max-width: 500px;
            margin: 0 auto 40px;
            font-size: 16px;
            line-height: 1.7;
            color: #c2c2c2;
        }

        .spotify-box {
            width: 100%;
            min-height: 352px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(0, 0, 0, 0.72);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            backdrop-filter: blur(16px);
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.75),
                0 0 50px rgba(255, 255, 255, 0.05);
        }

        .spotify-placeholder {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #999999;
            text-transform: uppercase;
        }

        .tease {
            font-size: 15px;
            color: #b5b5b5;
            font-style: italic;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .listen {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .back {
            display: inline-block;
            margin-top: 42px;
            color: #777777;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .back:hover {
            color: #ffffff;
        }

        @media (max-width: 700px) {
            .record {
                width: 420px;
                height: 420px;
            }

            .waveform {
                width: 180%;
            }

            .tonearm {
                right: -8%;
            }

            .track.five,
            .track.six {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="glow"></div>

        <div class="record"></div>

        <div class="waveform">

</body>
</html>
