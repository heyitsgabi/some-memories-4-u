<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #f4f4f4;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

/* =========================================
   PAGE
========================================= */

.page {
    min-height: 100vh;
    position: relative;
    overflow: hidden;

    padding: 90px 24px;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================================
   LIGHTING
========================================= */

.top-light,
.bottom-light,
.title-light {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.top-light {
    width: 950px;
    height: 480px;

    top: -340px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.20);

    filter: blur(105px);

    z-index: 0;
}

.bottom-light {
    width: 950px;
    height: 470px;

    bottom: -340px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.16);

    filter: blur(105px);

    z-index: 0;
}

.title-light {
    width: 650px;
    height: 250px;

    top: 18%;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.14);

    filter: blur(85px);

    z-index: 1;
}

/* =========================================
   MAIN CONTENT
========================================= */

.content {
    width: 100%;
    max-width: 560px;

    position: relative;

    z-index: 10;

    text-align: center;
}

/* =========================================
   HEADER
========================================= */

.eyebrow {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 5px;

    color: #9b9b9b;

    text-transform: uppercase;

    margin-bottom: 14px;
}

h1 {
    font-size: clamp(43px, 8vw, 70px);

    font-weight: normal;

    letter-spacing: -2px;

    margin-bottom: 24px;

    text-shadow:
        0 0 18px rgba(255,255,255,0.30),
        0 0 45px rgba(255,255,255,0.19),
        0 0 90px rgba(255,255,255,0.11);
}

/* =========================================
   TEXT + HEADPHONES
========================================= */

.text-with-headphones {
    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 13px;
}

.intro {
    margin-bottom: 28px;
}

.tease {
    margin-bottom: 11px;
}

.text-with-headphones p {
    flex: 1;

    color: #c2c2c2;
}

.intro p {
    font-size: 16px;

    line-height: 1.7;
}

.tease p {
    font-size: 15px;

    line-height: 1.7;

    font-style: italic;
}

/* =========================================
   HEADPHONES
========================================= */

.headphones {
    width: 21px;
    height: 17px;

    position: relative;

    flex-shrink: 0;

    opacity: 0.68;
}

.headphones::before {
    content: "";

    position: absolute;

    width: 17px;
    height: 14px;

    left: 2px;
    top: 0;

    border: 2px solid #aaa;

    border-bottom: none;

    border-radius: 12px 12px 0 0;
}

.headphones::after {
    content: "";

    position: absolute;

    width: 4px;
    height: 8px;

    left: 0;
    bottom: 0;

    border-radius: 3px;

    background: #aaa;

    box-shadow:
        17px 0 0 #aaa;
}

/* =========================================
   SPOTIFY
========================================= */

.spotify-container {
    width: 100%;

    max-width: 560px;

    margin: 0 auto 18px;
}

.spotify-label {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: #bdbdbd;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.spotify-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #1ed760;

    box-shadow:
        0 0 12px rgba(30,215,96,0.7),
        0 0 25px rgba(30,215,96,0.25);
}

.spotify-box {
    width: 100%;

    min-height: 352px;

    border: 1px solid rgba(255,255,255,0.25);

    background: rgba(0,0,0,0.78);

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    backdrop-filter: blur(16px);

    box-shadow:
        0 25px 85px rgba(0,0,0,0.82),
        0 0 55px rgba(30,215,96,0.045);
}

.spotify-box iframe {
    display: block;

    width: 100%;

    border: none;
}

/* =========================================
   OPEN IN SPOTIFY
========================================= */

.spotify-open {
    display: inline-block;

    margin-top: 14px;

    color: #8a8a8a;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    transition: color 0.2s ease;
}

.spotify-open:visited {
    color: #8a8a8a;
}

.spotify-open:hover {
    color: #ffffff;
}

/* =========================================
   LOWER TEXT
========================================= */

.listen {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 3px;

    color: #fff;

    text-transform: uppercase;

    margin-top: 4px;
}

/* =========================================
   BACK TO ARCHIVE
========================================= */

.back {
    display: inline-block;

    margin-top: 30px;

    color: #707070;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    transition: color 0.2s ease;
}

.back:visited {
    color: #707070;
}

.back:hover {
    color: #ffffff;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .page {
        padding: 75px 20px;
    }

    .top-light,
    .bottom-light {
        width: 700px;
    }

    .title-light {
        width: 520px;
    }

    .spotify-box {
        min-height: 320px;
    }
}

</style>
</head>

<body>

<main class="page">

    <!-- LIGHTING -->

    <div class="top-light"></div>

    <div class="bottom-light"></div>

    <div class="title-light"></div>


    <!-- MAIN CONTENT -->

    <div class="content">

        <div class="eyebrow">
            $OME MEMORIES 4 U
        </div>


        <h1>
            MUSIC
        </h1>


        <!-- INTRO -->

        <div class="text-with-headphones intro">

            <div class="headphones"></div>

            <p>
                A playlist made up of songs you like (I think) and songs you made me listen to.
            </p>

            <div class="headphones"></div>

        </div>


        <!-- SPOTIFY -->

        <div class="spotify-container">

            <div class="spotify-label">

                <span class="spotify-dot"></span>

                Now playing

            </div>


            <div class="spotify-box">

                <iframe
                    src="https://open.spotify.com/embed/playlist/6hKLkkNrVIzQXHrSKG5bsk?utm_source=generator"
                    width="100%"
                    height="352"
                    frameborder="0"
                    allowfullscreen=""
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>

            </div>


            <a
                href="https://open.spotify.com/playlist/6hKLkkNrVIzQXHrSKG5bsk"
                class="spotify-open"
                target="_blank"
                rel="noopener noreferrer">
                Open in Spotify ↗
            </a>

        </div>


        <!-- LOWER TEXT -->

        <div class="text-with-headphones tease">

            <div class="headphones"></div>

            <p>
                Some of these you’ll recognize… some you might not… hehe.
            </p>

            <div class="headphones"></div>

        </div>


        <div class="listen">
            Listen in order 😐
        </div>


        <!-- BACK -->

        <a href="/some-memories-4-u/archive.html" class="back">
            ← Back to archive
        </a>

    </div>

</main>

</body>
</html>
