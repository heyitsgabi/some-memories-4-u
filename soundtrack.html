<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soundtrack</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0d0d0d;
            color: #f5f5f5;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 25px;
            position: relative;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            width: 520px;
            height: 520px;
            background: rgba(255, 255, 255, 0.035);
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
        }

        .wave {
            position: absolute;
            width: 120%;
            height: 120px;
            border-top: 1px solid rgba(255, 255, 255, 0.035);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transform: rotate(-5deg);
            z-index: 0;
        }

        .wave.one {
            top: 18%;
        }

        .wave.two {
            bottom: 18%;
            transform: rotate(5deg);
        }

        .note {
            position: absolute;
            color: rgba(255, 255, 255, 0.12);
            font-family: Arial, sans-serif;
            font-size: 13px;
            z-index: 0;
        }

        .note.one {
            top: 15%;
            left: 13%;
        }

        .note.two {
            top: 28%;
            right: 12%;
        }

        .note.three {
            bottom: 18%;
            left: 17%;
        }

        .track-number {
            position: absolute;
            color: rgba(255, 255, 255, 0.08);
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            z-index: 0;
        }

        .track-one {
            top: 42%;
            left: 7%;
        }

        .track-two {
            bottom: 34%;
            right: 7%;
        }

        .content {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 2;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            color: #777777;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(42px, 8vw, 68px);
            font-weight: normal;
            letter-spacing: -2px;
            margin-bottom: 25px;
        }

        .intro {
            max-width: 500px;
            margin: 0 auto 38px;
            font-size: 16px;
            line-height: 1.7;
            color: #b0b0b0;
        }

        .spotify-box {
            width: 100%;
            min-height: 352px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            backdrop-filter: blur(8px);
        }

        .spotify-placeholder {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #777777;
            text-transform: uppercase;
        }

        .tease {
            font-size: 15px;
            color: #999999;
            font-style: italic;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .listen {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #f5f5f5;
            text-transform: uppercase;
        }

        .back {
            display: inline-block;
            margin-top: 40px;
            color: #666666;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .back:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="glow"></div>

        <div class="wave one"></div>
        <div class="wave two"></div>

        <div class="note one">♪</div>
        <div class="note two">♫</div>
        <div class="note three">♪</div>

        <div class="track-number track-one">01</div>
        <div class="track-number track-two">∞</div>

        <div class="content">

            <div class="eyebrow">
                $OME MEMORIES 4 U
            </div>

            <h1>THE SOUNDTRACK</h1>

            <p class="intro">
                A playlist made up of songs you like (I think) and songs you made me listen to.
            </p>

            <div class="spotify-box">
                <div class="spotify-placeholder">
                    Spotify playlist goes here
                </div>
            </div>

            <p class="tease">
                Some of these you’ll recognize… some you might not… hehe.
            </p>

            <div class="listen">
                Listen in order 😐
            </div>

            <a href="archive.html" class="back">
                ← Back to archive
            </a>

        </div>

    </main>

</body>
</html>
