<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    background: #050505;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #f4f4f4;
    font-family: Georgia, serif;
    overflow-x: hidden;

    opacity: 1;
    transition: opacity 0.08s ease;
}

body.leaving {
    opacity: 0;
}


/* =========================================
   PAGE
========================================= */

.page {
    min-height: 100vh;
    position: relative;
    overflow: hidden;

    padding: 90px 24px;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   LIGHTING
========================================= */

.top-light,
.bottom-light,
.title-light {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.top-light {
    width: 950px;
    height: 480px;

    top: -340px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.20);

    filter: blur(105px);
    z-index: 0;
}

.bottom-light {
    width: 950px;
    height: 470px;

    bottom: -340px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.16);

    filter: blur(105px);
    z-index: 0;
}

.title-light {
    width: 650px;
    height: 250px;

    top: 18%;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(255,255,255,0.14);

    filter: blur(85px);
    z-index: 1;
}


/* =========================================
   MAIN CONTENT
========================================= */

.content {
    width: 100%;
    max-width: 560px;

    position: relative;
    z-index: 10;

    text-align: center;
}


/* =========================================
   HEADER
========================================= */

.eyebrow {
    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 5px;

    color: #9b9b9b;

    text-transform: uppercase;

    margin-bottom: 14px;
}

h1 {
    font-size: clamp(43px, 8vw, 70px);

    font-weight: normal;

    letter-spacing: -2px;

    margin-bottom: 24px;

    text-shadow:
        0 0 18px rgba(255,255,255,0.30),
        0 0 45px rgba(255,255,255,0.19),
        0 0 90px rgba(255,255,255,0.11);
}


/* =========================================
   TEXT + HEADPHONES
========================================= */

.text-with-headphones {
    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 13px;
}

.intro {
    margin-bottom: 28px;
}

.tease {
    margin-bottom: 11px;
}

.text-with-headphones p {
    flex: 1;
    color: #c2c2c2;
}

.intro p {
    font-size: 16px;
    line-height: 1.7;
}

.tease p {
    font-size: 15px;
    line-height: 1.7;
    font-style: italic;
}


/* =========================================
   HEADPHONES
========================================= */

.headphones {
    width: 21px;
    height: 17px;

    position: relative;

    flex-shrink: 0;

    opacity: 0.68;
}

.headphones::before {
    content: "";

    position: absolute;

    width: 17px;
    height: 14px;

    left: 2px;
    top: 0;

    border: 2px solid #aaa;
    border-bottom: none;

    border-radius: 12px 12px 0 0;
}

.headphones::after {
    content: "";

    position: absolute;

    width: 4px;
    height: 8px;

    left: 0;
    bottom: 0;

    border-radius: 3px;

    background: #aaa;

    box-shadow:
        17px 0 0 #aaa;
}


/* =========================================
   SPOTIFY
========================================= */

.spotify-container {
    width: 100%;
    max-width: 600px;

    margin: 0 auto 18px;
}

.spotify-label {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 3px;

    color: #bdbdbd;

    text-transform: uppercase;

    margin-bottom: 11px;
}

.spotify-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #1ed760;

    box-shadow:
        0 0 10px rgba(30,215,96,0.65),
        0 0 22px rgba(30,215,96,0.22);
}


/* =========================================
   SPOTIFY BOX
========================================= */

.spotify-box {
    width: 100%;
    height: 390px;

    position: relative;

    background: #121212;

    display: block;

    overflow: hidden;

    box-sizing: border-box;

    border: 1px solid rgba(255,255,255,0.22);

    box-shadow:
        0 18px 55px rgba(0,0,0,0.75),
        0 0 35px rgba(255,255,255,0.025);

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease;
}


/*
 * Inner frame.
 */

.spotify-box::before {
    content: "";

    position: absolute;

    inset: 5px;

    border: 1px solid rgba(255,255,255,0.06);

    pointer-events: none;

    z-index: 5;
}


/*
 * Very subtle light sweep.
 */

.spotify-box::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            115deg,
            transparent 0%,
            rgba(255,255,255,0.025) 45%,
            transparent 60%
        );

    pointer-events: none;

    z-index: 4;
}


/* =========================================
   SPOTIFY IFRAME
========================================= */

.spotify-box iframe {
    display: block;

    position: absolute;

    top: 0;
    left: 0;

    width: 100% !important;
    height: 100% !important;

    min-width: 0 !important;
    max-width: none !important;

    min-height: 0 !important;
    max-height: none !important;

    border: 0;

    margin: 0;
    padding: 0;

    z-index: 2;

    background: #121212;
}

.spotify-box:hover {
    border-color: rgba(255,255,255,0.32);

    box-shadow:
        0 22px 65px rgba(0,0,0,0.82),
        0 0 45px rgba(255,255,255,0.035);

    transform: translateY(-2px);
}


/* =========================================
   OPEN IN SPOTIFY
========================================= */

.spotify-open {
    display: inline-block;

    margin-top: 14px;

    color: #8a8a8a;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: 3px;

    text-transform: uppercase;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.spotify-open:visited {
    color: #8a8a8a;
}

.spotify-open:hover {
    color: #ffffff;
    transform: translateY(-1px);
}


/* =========================================
   LOWER TEXT
========================================= */

.listen {
    font-family: Arial, sans-serif;

    font-size: 10px;
    letter-spacing: 3px;

    color: #fff;

    text-transform: uppercase;

    margin-top: 4px;
}


/* =========================================
   NAVIGATION
========================================= */

.navigation {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;

    margin-top: 30px;
}

.nav-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    color: #707070;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.nav-button:visited {
    color: #707070;
}

.nav-button:hover {
    color: #ffffff;
}

.nav-button:not(.back-button):hover {
    transform: translateX(2px);
}

.back-button:hover {
    transform: translateX(-2px);
}

.nav-arrow {
    display: inline-block;
    transition: transform 0.2s ease;
}

.back-button:hover .nav-arrow {
    transform: translateX(-3px);
}

.nav-button:not(.back-button):hover .nav-arrow {
    transform: translateX(3px);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .page {
        padding: 75px 20px;
    }

    .top-light,
    .bottom-light {
        width: 700px;
    }

    .title-light {
        width: 520px;
    }

    .spotify-container {
        max-width: 100%;
    }

    .spotify-box {
        height: 390px;
    }

    .intro p {
        font-size: 15px;
    }

    .tease p {
        font-size: 14px;
    }
}


@media (max-width: 430px) {

    .page {
        padding: 65px 17px;
    }

    .spotify-box {
        height: 390px;
    }

    .text-with-headphones {
        gap: 9px;
    }

    .headphones {
        transform: scale(0.85);
    }

    .navigation {
        gap: 12px;
    }

    .nav-button {
        font-size: 8px;
        letter-spacing: 2px;
    }

}


/* =========================================
   ACCESSIBILITY
========================================= */

@media (prefers-reduced-motion: reduce) {

    body {
        transition: none;
    }

    .spotify-box,
    .spotify-open,
    .nav-button {
        transition: none;
    }

}

</style>

</head>

<body>

<main class="page">

<!-- LIGHTING -->

<div class="top-light"></div>
<div class="bottom-light"></div>
<div class="title-light"></div>

<!-- MAIN CONTENT -->

<div class="content">

<!-- HEADER -->

<div class="eyebrow">
    $OME MEMORIES 4 U
</div>

<h1>
    MUSIC
</h1>

<!-- INTRO -->

<div class="text-with-headphones intro">

<div class="headphones"></div>

<p>
    A playlist made up of songs you like (I think) and songs you made me listen to.
</p>

<div class="headphones"></div>

</div>

<!-- SPOTIFY -->

<div class="spotify-container">

<div class="spotify-label">

    <span class="spotify-dot"></span>

    Now playing

</div>


<div class="spotify-box">

    <iframe
        src="https://open.spotify.com/embed/playlist/6hKLkkNrVIzQXHrSKG5bsk?utm_source=generator"
        title="Music playlist"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>


<a
    href="https://open.spotify.com/playlist/6hKLkkNrVIzQXHrSKG5bsk"
    class="spotify-open"
    target="_blank"
    rel="noopener noreferrer">
    Open in Spotify ↗
</a>

</div>

<!-- LOWER TEXT -->

<div class="text-with-headphones tease">

<div class="headphones"></div>

<p>
    Some of these you’ll recognize… some you might not… hehe.
</p>

<div class="headphones"></div>

</div>

<div class="listen">
    Listen in order 😐
</div>

<!-- NAVIGATION -->

<nav class="navigation">

<a
    href="/some-memories-4-u/archive.html"
    class="nav-button back-button page-link">
    <span class="nav-arrow">←</span>
    Back to Archive
</a>

<a
    href="/some-memories-4-u/moments.html"
    class="nav-button page-link">
    Continue
    <span class="nav-arrow">→</span>
    Moments
</a>

</nav>

</div>

</main>

<script>

/* =========================================
   FAST PAGE NAVIGATION
========================================= */

const pageLinks = document.querySelectorAll('.page-link');

pageLinks.forEach(function(link) {

    link.addEventListener('click', function(event) {

        const href = link.getAttribute('href');

        if (
            !href ||
            href.startsWith('#') ||
            link.target === '_blank' ||
            event.ctrlKey ||
            event.metaKey ||
            event.shiftKey ||
            event.altKey
        ) {
            return;
        }

        event.preventDefault();

        document.body.classList.add('leaving');

        window.location.href = href;

    });

});


/* =========================================
   BACK/FORWARD CACHE FIX
========================================= */

window.addEventListener('pageshow', function() {

    document.body.classList.remove('leaving');

});


/* =========================================
   PAGE HIDE SAFETY
========================================= */

window.addEventListener('pagehide', function() {

    document.body.classList.remove('leaving');

});

</script>

</body>
</html>
